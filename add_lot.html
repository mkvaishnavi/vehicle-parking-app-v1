<!DOCTYPE html>
<html>
    <head>
        <title>Add New Parking Lot</title>
    </head>
    <body>
        <h1>New Parking Lot</h1>
        <form action="/Add_Lot" method="POST">
            <label>Prime Location Name:</label>
            <input type="text" name="Location" required><br>

            <label>Address:</label>
            <input type="text" name="Address" required><br>

            <label>Pincode:</label>
            <input type="number" name="Pincode" required><br>

            <label>Price(per hour):</label>
            <input type="number" name="Price" required><br>

            <label>Maximum Spots:</label>
            <input type="number" name="Spots" required><br><br>

            <button type="submit">Add</button><br>
            <button type="button" onclick="window.location.href='/admin_dashboard'">Cancel</button>
        </form>
    </body>
</html>
