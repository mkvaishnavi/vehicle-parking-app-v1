<!DOCTYPE html>
<html>
    <head>
        <title>View Users</title>
    </head>
    <body>
        <h1>Registered Users</h1>
        {% if users and users|length>0 %}
        <table border="1">
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Full Name</th>
                <th>Address</th>
                <th>Pincode</th>
            </tr>
            {% for user in users %}
            <tr>
                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>
                <td>{{ user[4] }}</td>
                <td>{{ user[5] }}</td>
                <td>{{ user[6] }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p>No users found</p>
        {% endif %}
        <div class="nav-links">
            <a href="/admin_dashboard">Dashboard</a>
        </div>
    </body>
</html>
