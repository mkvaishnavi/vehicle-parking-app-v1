<!DOCTYPE html>
<html>
    <head>
        <title>Edit a parking lot</title>
    </head>
    <body>
        <h1>Edit Parking Lot</h1>
        {% if lot %}
        <form action="/Edit_Lot/{{ lot[0] }}" method="POST">
            <input type="hidden" name="lot_id" value="{{ lot[0] }}">

            <label>Prime Location Name:</label>
            <input type="text" name="Location" value="{{ lot[1] }}"><br>

            <label>Address:</label>
            <input type="text" name="Address" value="{{ lot[2] }}"><br>

            <label>Pincode:</label>
            <input type="number" name="Pincode" value="{{ lot[3] }}"><br>

            <label>Price(per hour):</label>
            <input type="number" name="Price" value="{{ lot[4] }}"><br>

            <label>Maximum Spots:</label>
            <input type="number" name="Spots" value="{{ lot[5] }}"><br><br>

            <input type="submit" value="Update">
            <a href="/admin_dashboard"><button type="button">Cancel</button></a>
        </form>
        {% else %}
        <p>No parking lot found to edit></p>
        {% endif %}
    </body>
</html>
